<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Homepage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h2>Dashboard</h2>
        </div>
        <ul class="nav-links">
            <li><a href="#" id="homeLink">Home</a></li>
            <li><a href="#" id="profileLink">Profile</a></li>
            <li><a href="#" id="settingsLink">Settings</a></li>
            <li><a href="#" id="logoutLink">Logout</a></li>
        </ul>
    </div>
    <div class="content">
        <header>
            <h1>Welcome to Your Dashboard</h1>
            <div class="user-info">
                <span>Hello, User</span>
                <button class="profile-btn">View Profile</button>
            </div>
        </header>

        <div class="dashboard-cards">
            <div class="card">
                <h3>Statistics</h3>
                <p>Current stats will be displayed here.</p>
            </div>
            <div class="card">
                <h3>Recent Activity</h3>
                <p>Your most recent activities will be shown here.</p>
            </div>
            <div class="card">
                <h3>Settings</h3>
                <p>Quick access to settings.</p>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
