<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Move the Red Square!</h1>
        <p>Use the arrow keys to move the square and avoid obstacles.</p>
    </header>

    <main>
        <canvas id="gameCanvas"></canvas>
        <div id="scoreboard">
            <p>Score: <span id="score">0</span></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Simple Game Studio</p>
    </footer>

    <script src="game.js"></script>
</body>
</html>
