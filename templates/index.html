<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>
    <style>
        /* style.css */

/* Reset some default styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* General styles */
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

h1 {
    font-size: 2rem;
}

#schedule-container {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 20px;
}

#calendar {
    flex: 2;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

#calendar-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    margin-bottom: 10px;
}

#calendar-body {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

#calendar-body div {
    width: calc(14.28% - 10px);
    height: 100px;
    border: 1px solid #ccc;
    background-color: #fafafa;
    text-align: center;
    padding-top: 10px;
    border-radius: 5px;
    cursor: pointer;
}

#calendar-body div:hover {
    background-color: #e0e0e0;
}

#employee-section {
    flex: 1;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

label {
    font-size: 1rem;
}

input, select, button {
    padding: 10px;
    font-size: 1rem;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    background-color: #28a745;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #218838;
}

    </style>
<body>

    <header>
        <h1>Employee Schedule Management</h1>
    </header>

    <main>
        <div id="schedule-container">
            <div id="calendar">
                <h2>Weekly Schedule</h2>
                <div id="calendar-header">
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                    <span>Sun</span>
                </div>
                <div id="calendar-body">
                    <!-- Days will be filled with available shift slots -->
                </div>
            </div>

            <div id="employee-section">
                <h2>Assign Employees</h2>
                <form id="assign-shift-form">
                    <label for="employee-name">Employee Name</label>
                    <input type="text" id="employee-name" placeholder="Enter employee name" required>
                    
                    <label for="shift-day">Day</label>
                    <select id="shift-day" required>
                        <option value="Mon">Monday</option>
                        <option value="Tue">Tuesday</option>
                        <option value="Wed">Wednesday</option>
                        <option value="Thu">Thursday</option>
                        <option value="Fri">Friday</option>
                        <option value="Sat">Saturday</option>
                        <option value="Sun">Sunday</option>
                    </select>

                    <label for="shift-time">Shift Time</label>
                    <select id="shift-time" required>
                        <option value="9am - 5pm">9 AM - 5 PM</option>
                        <option value="5pm - 9pm">5 PM - 9 PM</option>
                        <option value="9pm - 1am">9 PM - 1 AM</option>
                    </select>

                    <button type="submit">Assign Shift</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Employee Scheduling System</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
